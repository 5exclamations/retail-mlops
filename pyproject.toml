[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-mlops"
version = "0.1.0"
description = "End-to-end MLOps platform for retail demand forecasting"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.in"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_mlops = ["serving/dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, no external services",
    "integration: trains a tiny model with a local MLflow store",
    "api: exercises the FastAPI app (SQLite by default, Postgres if TEST_DATABASE_URL is set)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E702", "B008"]  # long lines in tables/messages, compact argparse
